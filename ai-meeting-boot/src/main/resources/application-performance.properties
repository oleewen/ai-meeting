# 会议室预约系统性能优化配置

# 数据库连接池配置
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=MeetingRoomHikariCP
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# MyBatis配置优化
mybatis.configuration.cache-enabled=true
mybatis.configuration.lazy-loading-enabled=true
mybatis.configuration.multiple-result-sets-enabled=true
mybatis.configuration.use-column-label=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.auto-mapping-behavior=partial
mybatis.configuration.default-executor-type=reuse
mybatis.configuration.default-statement-timeout=30

# JVM优化参数建议
# -Xms512m -Xmx1024m
# -XX:+UseG1GC
# -XX:MaxGCPauseMillis=200
# -XX:+UseStringDeduplication
# -XX:+OptimizeStringConcat

# Tomcat性能优化
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.max-http-post-size=2MB

# 压缩配置
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# 缓存配置
spring.cache.type=simple
spring.cache.cache-names=meetingRooms,users,bookings
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

# 日志性能优化
logging.level.com.only.ai.meetingroom=INFO
logging.level.org.springframework.web=WARN
logging.level.org.mybatis=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n

# 异步处理配置
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=meeting-room-task-

# 监控配置
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# 安全配置
server.error.include-stacktrace=never
server.error.include-message=never

# 静态资源缓存
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.cache-public=true

# 分页默认配置
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# 业务配置
app.booking.max-advance-days=30
app.booking.min-duration-minutes=30
app.booking.max-duration-hours=8
app.booking.checkin-window-before-minutes=15
app.booking.checkin-window-after-minutes=30
app.booking.cancel-deadline-hours=2

# 缓存TTL配置（秒）
app.cache.meeting-rooms-ttl=3600
app.cache.users-ttl=1800
app.cache.room-details-ttl=3600
app.cache.booking-list-ttl=300