#服务器配置
server.port=8082
spring.main.allow-bean-definition-overriding=true
#日志配置
root.log.level=INFO
root.log.path=log/
#swagger配置
swagger.enable=true
# SpringDoc配置
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false

#链路耗时日志
trace.log.enable=true

# Transformer配置（开发环境默认值）
app.secret=dev-secret-key-for-meeting-room-booking-system

# H2数据库配置
spring.datasource.url=jdbc:h2:mem:meetingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.druid.initial-size=5
spring.datasource.druid.max-active=20
spring.datasource.druid.min-idle=5

# H2控制台（开发环境）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 数据库初始化
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.only.ai.meeting.infrastructure.entity
